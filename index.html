<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Monitoring System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Scholarship Monitoring & Compliance</h1>
        <div id="authSection">
            <div id="loggedIn" style="display:none;">
                <span id="userInfo"></span>
                <button id="logoutBtn">Logout</button>
            </div>
            <div id="loggedOut">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button id="loginBtn">Login</button>
            </div>
        </div>
    </header>

    <main>
        <section id="roleSection" style="display:none;">
            <!-- Scholar -->
            <div id="scholarView" style="display:none;">
                <h2>Scholar</h2>
                <div class="card">
                    <h3>Submit / Correct Grades</h3>
                    <form id="submissionForm">
                        <div>
                            <label>AY <input type="text" id="ay" value="2026-2027" required></label>
                            <label>Sem <input type="number" id="sem" value="1" required></label>
                        </div>
                        <div>
                            <label>GWA <input type="number" step="0.01" id="gwa" required></label>
                            <label>Units <input type="number" id="units" required></label>
                        </div>
                        <div>
                            <label>Failed <input type="number" id="failed" required></label>
                            <label>INC <input type="number" id="inc" required></label>
                            <label>Drop <input type="number" id="dropped" required></label>
                        </div>
                        <div>
                            <label>Grade Doc Ref <input type="text" id="evidence" required></label>
                        </div>
                        <button type="submit">Submit / Update</button>
                    </form>
                    <div id="subMsg"></div>
                </div>
                <div class="card">
                    <h3>My Submissions</h3>
                    <div id="mySubmissions"></div>
                </div>
            </div>

            <!-- Staff -->
            <div id="staffView" style="display:none;">
                <h2>Staff</h2>
                <div class="card">
                    <h3>Filter</h3>
                    <label>AY <input type="text" id="staffAy" value="2026-2027"></label>
                    <label>Sem <input type="number" id="staffSem" value="1"></label>
                    <label>Search <input type="text" id="search" placeholder="ID or Name"></label>
                    <label>Program 
                        <select id="progFilter">
                            <option value="">All</option>
                            <option value="EXCELLENCE">Excellence</option>
                            <option value="ACCESS">Access</option>
                        </select>
                    </label>
                    <label>Compliance
                        <select id="compFilter">
                            <option value="">All</option>
                            <option value="Compliant">Compliant</option>
                            <option value="With Deficiency">With Deficiency</option>
                            <option value="UnEvaluated">UnEvaluated</option>
                        </select>
                    </label>
                    <button id="applyFilters">Apply</button>
                </div>
                <div class="card">
                    <h3>Dashboard</h3>
                    <div id="dashCounts"></div>
                </div>
                <div class="card">
                    <h3>Submissions</h3>
                    <div id="allSubmissions"></div>
                </div>
                <div class="card" id="verifyCard" style="display:none;">
                    <h3>Verification</h3>
                    <div id="verifyInfo"></div>
                    <button id="verifyBtn">Verify</button>
                    <button id="returnBtn">Return</button>
                    <input type="text" id="verifyReason" placeholder="Reason">
                </div>
                <div class="card" id="evalCard" style="display:none;">
                    <h3>Evaluation & Renewal</h3>
                    <div id="evalInfo"></div>
                    <button id="evalBtn">Evaluate Compliance</button>
                    <div id="policyChecks"></div>
                    <label>Notes <input type="text" id="decisionNotes"></label>
                    <button id="approveBtn">Approve</button>
                    <button id="holdBtn">Hold</button>
                </div>
                <div class="card">
                    <h3>History</h3>
                    <div id="history"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
